name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # REQ-01 / REQ-08 — boundary and network rules are lint errors, not review notes
      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build both browser targets
        run: pnpm build

      # Includes the bundle gates in tools/gates: they read what actually
      # ships rather than what the source says, and they fail — never skip —
      # when the build is broken.
      - name: unit tests and bundle gates
        run: pnpm test

      - name: upload builds
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: apps/extension/dist
          retention-days: 14

      # REQ-31 — the UX chain must not drift
      - name: ux lint
        run: python3 docs/ux/lint.py
