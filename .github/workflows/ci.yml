name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # REQ-01 / REQ-08 — boundary and network rules are lint errors, not review notes
      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build both browser targets
        run: pnpm build

      # Includes the bundle gates in tools/gates: they read what actually
      # ships rather than what the source says, and they fail — never skip —
      # when the build is broken.
      - name: unit tests and bundle gates
        run: pnpm test

      - name: upload builds
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: apps/extension/dist
          retention-days: 14

      # REQ-31 — the UX chain must not drift
      - name: ux lint
        run: python3 docs/ux/lint.py

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build

      # Extensions only load in a headed persistent context, hence xvfb.
      # Firefox is absent on purpose: Playwright cannot load an MV3 extension
      # into it. That side is covered by web-ext and sits in the carry-over
      # ledger rather than being quietly claimed here.
      - name: scenarios SCN-003 and SCN-019
        run: xvfb-run --auto-servernum pnpm test:e2e

  e2e-firefox:
    name: e2e (firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox
      - run: pnpm build

      # geckodriver installs the extension the way Mozilla supports for
      # unpacked builds; the run fails loudly if the add-on is absent, so a
      # browser without it can never produce a green result.
      - name: scenarios in Firefox
        env:
          FIREFOX_BINARY: /root/.cache/ms-playwright/firefox-1538/firefox/firefox
        run: node tools/firefox-e2e.mjs
